[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentsafe"
version = "0.2.0"
description = "Runtime safety monitoring for AI agents"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "openai>=1.0.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "pydantic>=2.0.0",
    "typer>=0.12.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]
ml = [
    "sentence-transformers>=3.0.0",
]

[project.scripts]
agentsafe = "agentsafe.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["agentsafe"]
